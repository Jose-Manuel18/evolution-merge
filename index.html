<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Evolución Cósmica</title>
<meta name="theme-color" content="#070816">
<meta name="description" content="Junta planetas iguales para que evolucionen. Une dos sistemas solares y crea una galaxia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#070816;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #box{position:relative}
  canvas{display:block}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:rgba(7,8,22,.78);backdrop-filter:blur(4px)}
  .ov[hidden]{display:none}
  h1{margin:0;font-size:34px;letter-spacing:.5px;background:linear-gradient(90deg,#ffd27a,#ff8a3d,#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0;max-width:300px;line-height:1.45;color:#cfd3ff}
  .big{font-size:44px;font-weight:800}
  button{font:inherit;font-weight:700;font-size:18px;color:#160c2e;background:#ffd27a;border:0;border-radius:999px;padding:12px 30px;cursor:pointer}
  button.alt{background:transparent;color:#ffd27a;border:1px solid #ffd27a66}
  #mute{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:transparent;color:#fff;padding:6px 10px;font-size:18px;opacity:.7}
  small,small a{color:#8a8fbf;font-size:11px}
</style>
</head>
<body>
<div id="wrap"><div id="box">
  <canvas id="cv" role="img" aria-label="Tablero de juego"></canvas>
  <button id="mute" aria-label="Sonido">🔊</button>
  <div class="ov" id="menu">
    <h1>Evolución Cósmica</h1>
    <p>Suelta cuerpos en el espacio. Cuando dos iguales se tocan, evolucionan: polvo → asteroide → luna → planeta → estrella → sistema solar.</p>
    <p><b>Une dos sistemas solares para crear una galaxia.</b></p>
    <button id="play">Jugar</button>
    <small>Texturas: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> (CC BY 4.0)</small>
  </div>
  <div class="ov" id="over" hidden>
    <h1>Fin del universo</h1>
    <div class="big" id="final">0</div>
    <p id="bestTxt"></p>
    <button id="again">Otra vez</button>
    <button class="alt" id="share">Compartir</button>
  </div>
</div></div>
<script src="vendor/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Events } = Matter;
const W = 400, H = 720, WL = 10, WR = 390, FLOOR = 676, DANGER = 150, DROP_Y = 100, Q = 2.5, STEP = 1000 / 60;
const TIERS = [
  { name: 'Polvo cósmico', r: 13, color: '#c6a8ff' },
  { name: 'Asteroide', r: 18, tex: 'ceres', color: '#a39a90' },
  { name: 'Luna', r: 24, tex: 'moon', color: '#dcdcdc' },
  { name: 'Mercurio', r: 31, tex: 'mercury', color: '#b3aca3' },
  { name: 'Marte', r: 38, tex: 'mars', color: '#e0703f' },
  { name: 'Venus', r: 46, tex: 'venus', color: '#ecc77e' },
  { name: 'Tierra', r: 55, tex: 'earth', color: '#4a9cf0', atmo: '#8fd0ff' },
  { name: 'Neptuno', r: 64, tex: 'neptune', color: '#4a6ee0', atmo: '#7fa4ff' },
  { name: 'Saturno', r: 75, tex: 'saturn', color: '#e6cc92', ring: true },
  { name: 'Júpiter', r: 86, tex: 'jupiter', color: '#ddb07f' },
  { name: 'Sol', r: 98, tex: 'sun', color: '#ffb52e', sun: true },
  { name: 'Sistema solar', r: 112, color: '#ffd27a', system: true },
];
const LAST = TIERS.length - 1;
const DROP_WEIGHTS = [0.3, 0.27, 0.2, 0.14, 0.09]; // only the 5 smallest can be dropped

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const mk = (w, h = w) => Object.assign(document.createElement('canvas'), { width: w, height: h });

// ---------- sprites ----------
function pixels(img) {
  const g = mk(img.width, img.height).getContext('2d');
  g.drawImage(img, 0, 0);
  return { w: img.width, h: img.height, d: g.getImageData(0, 0, img.width, img.height).data };
}
// Orthographic projection of an equirectangular map onto a disc (looks like a real sphere).
function sphere(img, S, clouds) {
  const c = mk(S), g = c.getContext('2d'), R = S / 2;
  let src, cl;
  try { src = pixels(img); cl = clouds && pixels(clouds); }
  catch { // file:// taints the canvas: fall back to a flat clipped texture
    g.beginPath(); g.arc(R, R, R, 0, 7); g.clip(); g.drawImage(img, 0, 0, img.width / 2, img.height, 0, 0, S, S); return c;
  }
  const out = g.createImageData(S, S), d = out.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const nx = (x + .5 - R) / R, ny = (y + .5 - R) / R, q = nx * nx + ny * ny;
    if (q > 1) continue;
    const u = Math.atan2(nx, Math.sqrt(1 - q)) / (2 * Math.PI) + .5, v = Math.acos(-ny) / Math.PI;
    const i = ((Math.min(src.h - 1, v * src.h | 0)) * src.w + (u * src.w | 0)) * 4, o = (y * S + x) * 4;
    let r = src.d[i], gg = src.d[i + 1], b = src.d[i + 2];
    if (cl) { const k = cl.d[i] / 255 * .9; r += (255 - r) * k; gg += (255 - gg) * k; b += (255 - b) * k; }
    d[o] = r; d[o + 1] = gg; d[o + 2] = b; d[o + 3] = Math.min(1, (1 - Math.sqrt(q)) * R) * 255;
  }
  g.putImageData(out, 0, 0);
  return c;
}
function dust(S) {
  const c = mk(S), g = c.getContext('2d'), R = S / 2;
  const gr = g.createRadialGradient(R * .8, R * .75, 0, R, R, R);
  gr.addColorStop(0, '#fff6ff'); gr.addColorStop(.35, '#c6a8ff'); gr.addColorStop(.8, '#6b4bd6'); gr.addColorStop(1, '#2e1f73');
  g.fillStyle = gr; g.beginPath(); g.arc(R, R, R, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 14; i++) { const a = Math.random() * 7, d = Math.random() * R * .8; g.fillRect(R + Math.cos(a) * d, R + Math.sin(a) * d, S / 30, S / 30); }
  return c;
}
// Fixed light from the top-left: drawn unrotated on top of the spinning body.
function shade(S, atmo, sun) {
  const c = mk(S), g = c.getContext('2d'), R = S / 2;
  let gr;
  if (sun) {
    gr = g.createRadialGradient(R, R, 0, R, R, R);
    gr.addColorStop(0, 'rgba(255,255,210,.2)'); gr.addColorStop(.7, 'rgba(255,120,0,0)'); gr.addColorStop(1, 'rgba(140,30,0,.55)');
  } else {
    gr = g.createRadialGradient(R * .6, R * .55, 0, R, R, R * 1.02);
    gr.addColorStop(0, 'rgba(255,255,255,.22)'); gr.addColorStop(.35, 'rgba(0,0,0,0)'); gr.addColorStop(.8, 'rgba(0,0,12,.45)'); gr.addColorStop(1, 'rgba(0,0,12,.82)');
  }
  g.fillStyle = gr; g.beginPath(); g.arc(R, R, R, 0, 7); g.fill();
  if (atmo) {
    const a = g.createRadialGradient(R, R, R * .8, R, R, R);
    a.addColorStop(0, atmo + '00'); a.addColorStop(1, atmo + 'b0');
    g.fillStyle = a; g.beginPath(); g.arc(R, R, R, 0, 7); g.fill();
  }
  return c;
}
function glow(S) {
  const c = mk(S), g = c.getContext('2d'), R = S / 2, gr = g.createRadialGradient(R, R, 0, R, R, R);
  gr.addColorStop(0, 'rgba(255,200,90,.65)'); gr.addColorStop(.5, 'rgba(255,140,30,.2)'); gr.addColorStop(1, 'rgba(255,120,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  return c;
}
// Saturn's rings, split in a back half (behind the planet) and a front half.
function rings(r, pr, img) {
  const S = Math.ceil(r * 2 * Q), R = S / 2, back = mk(S), front = mk(S);
  const bg = back.getContext('2d'), fg = front.getContext('2d'), bo = bg.createImageData(S, S), fo = fg.createImageData(S, S);
  let src; try { src = pixels(img); } catch { return {}; }
  const tilt = .32, rot = -.35, cs = Math.cos(rot), sn = Math.sin(rot), inner = pr * 1.22 / r;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (x + .5 - R) / R, dy = (y + .5 - R) / R, lx = dx * cs + dy * sn, ly = (-dx * sn + dy * cs) / tilt, d = Math.hypot(lx, ly);
    if (d < inner || d > 1) continue;
    const i = ((d - inner) / (1 - inner) * (src.w - 1) | 0) * 4, o = (y * S + x) * 4, t = ly < 0 ? bo.data : fo.data, k = ly < 0 ? .75 : 1;
    t[o] = src.d[i] * k; t[o + 1] = src.d[i + 1] * k; t[o + 2] = src.d[i + 2] * k; t[o + 3] = src.d[i + 3];
  }
  bg.putImageData(bo, 0, 0); fg.putImageData(fo, 0, 0);
  return { back, front };
}
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const SPR = [];
async function buildSprites() {
  const names = [...new Set(TIERS.map(t => t.tex).filter(Boolean)), 'earth_clouds', 'saturn_ring'];
  const tex = Object.fromEntries(await Promise.all(names.map(async n => [n, await load(`assets/textures/${n}.${n === 'saturn_ring' ? 'png' : 'jpg'}`)])));
  TIERS.forEach((t, i) => {
    if (t.system) return SPR.push({});
    const pr = t.ring ? t.r * .55 : t.r, S = Math.max(48, Math.ceil(pr * 2 * Q));
    const s = { pr, img: t.tex ? sphere(tex[t.tex], S, t.tex === 'earth' && tex.earth_clouds) : dust(S), shade: shade(S, t.atmo, t.sun) };
    if (t.sun) s.glow = glow(Math.ceil(pr * 3.6 * Q));
    if (t.ring) Object.assign(s, rings(t.r, pr, tex.saturn_ring));
    SPR.push(s);
  });
}

// ---------- drawing ----------
let now = 0;
function drawBody(ti, x, y, ang, s = 1) {
  const T = TIERS[ti], p = SPR[ti];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (T.system) { drawSystem(T.r, ang); ctx.restore(); return; }
  if (p.glow) ctx.drawImage(p.glow, -p.pr * 1.8, -p.pr * 1.8, p.pr * 3.6, p.pr * 3.6);
  ctx.rotate(ang);
  if (p.back) ctx.drawImage(p.back, -T.r, -T.r, T.r * 2, T.r * 2);
  ctx.drawImage(p.img, -p.pr, -p.pr, p.pr * 2, p.pr * 2);
  ctx.rotate(-ang);
  ctx.drawImage(p.shade, -p.pr, -p.pr, p.pr * 2, p.pr * 2);
  if (p.front) { ctx.rotate(ang); ctx.drawImage(p.front, -T.r, -T.r, T.r * 2, T.r * 2); }
  ctx.restore();
}
const ORBITS = [[3, .34, .045, 1.6], [5, .47, .06, 1.1], [6, .6, .065, .8], [4, .72, .05, .6], [9, .86, .09, .4]]; // tier, orbit, size, speed
function drawSystem(R, ang) {
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
  g.addColorStop(0, 'rgba(255,200,120,.3)'); g.addColorStop(.45, 'rgba(40,30,100,.55)'); g.addColorStop(1, 'rgba(18,12,48,.9)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,150,.55)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.13)';
  for (const [ti, f, sz, sp] of ORBITS) {
    ctx.beginPath(); ctx.arc(0, 0, f * R, 0, 7); ctx.stroke();
    const a = ang + now / 1000 * sp + ti;
    drawBody(ti, Math.cos(a) * f * R, Math.sin(a) * f * R, 0, R * sz / TIERS[ti].r);
  }
  drawBody(10, 0, 0, now / 4000, R * .2 / TIERS[10].r);
}
let bg;
const STARS = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, p: Math.random() * 7 }));
function buildBg() {
  bg = mk(W * 2, H * 2); const g = bg.getContext('2d'); g.scale(2, 2);
  const lg = g.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, '#060716'); lg.addColorStop(1, '#170c33'); g.fillStyle = lg; g.fillRect(0, 0, W, H);
  for (const [x, y, r, c] of [[80, 220, 200, '90,60,200'], [330, 520, 230, '200,60,140'], [220, 40, 160, '40,120,220']]) {
    const n = g.createRadialGradient(x, y, 0, x, y, r); n.addColorStop(0, `rgba(${c},.18)`); n.addColorStop(1, `rgba(${c},0)`); g.fillStyle = n; g.fillRect(0, 0, W, H);
  }
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * .6 + .1})`; const s = Math.random() * 1.2 + .3; g.fillRect(Math.random() * W, Math.random() * H, s, s); }
}

// ---------- audio ----------
let ac, muted = localStorage.getItem('evo-muted') === '1';
function tone(f, dur = .35, type = 'sine', vol = .22, delay = 0) {
  if (muted) return;
  try {
    ac = ac || new AudioContext();
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f * .7, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + .12);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
  } catch {}
}

// ---------- game state ----------
const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
const wallOpts = { isStatic: true, friction: .1 };
Composite.add(engine.world, [
  Bodies.rectangle(WL - 30, FLOOR / 2 - 200, 60, FLOOR + 400, wallOpts),
  Bodies.rectangle(WR + 30, FLOOR / 2 - 200, 60, FLOOR + 400, wallOpts),
  Bodies.rectangle(W / 2, FLOOR + 30, W, 60, wallOpts),
]);
let state = 'menu', score = 0, best = +localStorage.getItem('evo-best') || 0, cur, next, aimX = W / 2, canDrop = true, maxTier = 0;
let merges = [], fx = [], popups = [], galaxies = [], toast = null, shake = 0, danger = 0;
const pick = () => { let r = Math.random(); for (let i = 0; i < DROP_WEIGHTS.length; i++) if ((r -= DROP_WEIGHTS[i]) < 0) return i; return 0; };

function spawn(ti, x, y) {
  const b = Bodies.circle(x, y, TIERS[ti].r, { restitution: .2, friction: .06, frictionStatic: .5, frictionAir: .004, density: .0015 });
  b.tier = ti; b.born = now; b.over = 0;
  Composite.add(engine.world, b);
  return b;
}
function onCollide(e) {
  for (const { bodyA: a, bodyB: b } of e.pairs)
    if (a.tier !== undefined && a.tier === b.tier && !a.gone && !b.gone) { a.gone = b.gone = true; merges.push([a, b]); }
}
Events.on(engine, 'collisionStart', onCollide);
Events.on(engine, 'collisionActive', onCollide);

function burst(x, y, ti, n = 18) {
  const T = TIERS[ti];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 7, v = (.6 + Math.random() * 2.4) * (1 + T.r / 60);
    fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, s: 1.5 + Math.random() * 2.5, c: Math.random() < .3 ? '#fff' : T.color });
  }
  fx.push({ ring: true, x, y, r: T.r * .6, life: 1, c: T.color });
}
function processMerges() {
  for (const [a, b] of merges) {
    Composite.remove(engine.world, [a, b]);
    const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2, ti = a.tier + 1;
    if (a.tier === LAST) { // two solar systems -> galaxy
      score += 1000; galaxies.push({ x, y, t0: now, j: Array.from({ length: 420 }, () => [Math.random() * 26 - 13, Math.random() * .5 - .25]) }); popups.push({ x, y, txt: '¡GALAXIA! +1000', life: 1, big: true });
      shake = 14; [0, 4, 7, 12].forEach((s, i) => tone(262 * 2 ** (s / 12), .9, 'triangle', .18, i * .12)); navigator.vibrate?.([40, 60, 80]);
      continue;
    }
    const nb = spawn(ti, x, y);
    Body.setVelocity(nb, { x: (a.velocity.x + b.velocity.x) / 2, y: (a.velocity.y + b.velocity.y) / 2 });
    const pts = (ti + 1) * (ti + 2) / 2;
    score += pts; popups.push({ x, y, txt: '+' + pts, life: 1 });
    burst(x, y, ti);
    tone(180 * 2 ** (ti / 4)); navigator.vibrate?.(ti > 6 ? 30 : 10);
    if (ti >= 6) shake = Math.max(shake, ti - 3);
    if (ti > maxTier) { maxTier = ti; if (ti >= 5) toast = { txt: '¡Nueva era: ' + TIERS[ti].name + '!', life: 1 }; }
  }
  merges = [];
}
function drop() {
  if (state !== 'play' || !canDrop) return;
  spawn(cur, clampX(aimX, cur), DROP_Y);
  tone(140, .18, 'sine', .12);
  canDrop = false;
  setTimeout(() => { cur = next; next = pick(); canDrop = true; }, 450);
}
const clampX = (x, ti) => Math.max(WL + TIERS[ti].r, Math.min(WR - TIERS[ti].r, x));
const bodies = () => Composite.allBodies(engine.world).filter(b => b.tier !== undefined);

function start() {
  Composite.clear(engine.world, true);
  score = 0; maxTier = 0; merges = []; fx = []; popups = []; galaxies = []; toast = null; danger = 0;
  cur = pick(); next = pick(); canDrop = true; state = 'play';
  $('menu').hidden = $('over').hidden = true;
}
function gameOver() {
  state = 'over';
  if (score > best) { best = score; localStorage.setItem('evo-best', best); }
  $('final').textContent = score;
  $('bestTxt').textContent = `Récord: ${best} · Llegaste a: ${TIERS[maxTier].name}`;
  $('over').hidden = false;
  tone(110, 1, 'sawtooth', .1);
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(t) {
  const dt = Math.min(50, t - last); last = t; now = t;
  if (state === 'play') {
    acc += dt;
    while (acc >= STEP) { Engine.update(engine, STEP); processMerges(); acc -= STEP; }
    danger = 0;
    for (const b of bodies()) {
      if (now - b.born > 1200 && b.position.y - TIERS[b.tier].r < DANGER) b.over += dt; else b.over = 0;
      danger = Math.max(danger, b.over);
    }
    if (danger > 2500) gameOver();
  }
  draw(dt);
  requestAnimationFrame(frame);
}
function draw(dt) {
  const k = dt / 16.67;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  for (const s of STARS) { ctx.fillStyle = `rgba(255,255,255,${.35 + .35 * Math.sin(now / 700 + s.p)})`; ctx.fillRect(s.x, s.y, 1.6, 1.6); }
  if (shake > .1) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .88; }

  // playfield
  ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fillRect(WL, DANGER - 30, WR - WL, FLOOR - DANGER + 30);
  ctx.strokeStyle = 'rgba(180,170,255,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(WL, DANGER - 30); ctx.lineTo(WL, FLOOR); ctx.lineTo(WR, FLOOR); ctx.lineTo(WR, DANGER - 30); ctx.stroke();
  ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5;
  ctx.strokeStyle = danger > 0 ? `rgba(255,70,90,${.5 + .5 * Math.sin(now / 90)})` : 'rgba(255,90,110,.25)';
  ctx.beginPath(); ctx.moveTo(WL, DANGER); ctx.lineTo(WR, DANGER); ctx.stroke();

  if (state === 'play' && canDrop) {
    const x = clampX(aimX, cur);
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(x, DROP_Y); ctx.lineTo(x, FLOOR); ctx.stroke();
    ctx.setLineDash([]);
    drawBody(cur, x, DROP_Y, 0);
  }
  ctx.setLineDash([]);

  for (const b of bodies()) drawBody(b.tier, b.position.x, b.position.y, b.angle, Math.min(1, .55 + (now - b.born) / 180 * .45));

  // effects
  ctx.globalCompositeOperation = 'lighter';
  fx = fx.filter(p => (p.life -= .025 * k) > 0);
  for (const p of fx) {
    ctx.globalAlpha = p.life;
    if (p.ring) { p.r += 2.2 * k; ctx.strokeStyle = p.c; ctx.lineWidth = 3 * p.life; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke(); }
    else { p.x += p.vx * k; p.y += p.vy * k; p.vx *= .96; p.vy *= .96; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); }
  }
  galaxies = galaxies.filter(g => now - g.t0 < 3200);
  for (const g of galaxies) {
    const p = (now - g.t0) / 3200, grow = 1 - (1 - Math.min(1, p * 2.5)) ** 3;
    for (let i = 0; i < 420; i++) {
      const f = i / 420, a = (i % 3) * 2.094 + f * 5.5 + (now - g.t0) / 500 + g.j[i][1], rad = (f * 190 + g.j[i][0] * f) * grow;
      ctx.globalAlpha = (1 - p) * (1 - f * .5);
      ctx.fillStyle = `hsl(${45 + f * 220},90%,${80 - f * 25}%)`;
      const s = 1 + (1 - f) * 2.5;
      ctx.fillRect(g.x + Math.cos(a) * rad, g.y + Math.sin(a) * rad * .55, s, s);
    }
    const c = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, 70); c.addColorStop(0, 'rgba(255,230,180,.9)'); c.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.globalAlpha = 1 - p; ctx.fillStyle = c; ctx.fillRect(g.x - 70, g.y - 70, 140, 140);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center';
  popups = popups.filter(p => (p.life -= (p.big ? .008 : .02) * k) > 0);
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2); p.y -= .6 * k;
    ctx.font = `800 ${p.big ? 30 : 18}px system-ui`; ctx.fillStyle = p.big ? '#ffd27a' : '#fff';
    ctx.fillText(p.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  if (toast && (toast.life -= .006 * k) > 0) {
    ctx.globalAlpha = Math.min(1, toast.life * 3); ctx.font = '800 22px system-ui'; ctx.fillStyle = '#ffd27a';
    ctx.fillText(toast.txt, W / 2, DANGER + 50); ctx.globalAlpha = 1;
  }

  // HUD
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '800 30px system-ui'; ctx.fillText(score, 16, 42);
  ctx.font = '600 12px system-ui'; ctx.fillStyle = '#9aa0d0'; ctx.fillText('Récord ' + Math.max(best, score), 16, 60);
  ctx.textAlign = 'right'; ctx.fillText('Siguiente', 384, 22);
  if (next !== undefined) drawBody(next, 366, 46, 0, 15 / TIERS[next].r);

  // evolution strip
  const gap = (WR - WL) / TIERS.length;
  TIERS.forEach((t, i) => {
    ctx.globalAlpha = i <= maxTier || state === 'menu' ? 1 : .25;
    drawBody(i, WL + gap * (i + .5), 700, 0, (t.system ? 13 : 11) / t.r);
  });
  ctx.globalAlpha = 1;
}

// ---------- input & layout ----------
let scale = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(devicePixelRatio || 1, 2.5);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = W * s * dpr | 0; cv.height = H * s * dpr | 0; scale = s * dpr;
}
addEventListener('resize', resize); resize();
const aim = e => { const r = cv.getBoundingClientRect(); aimX = (e.clientX - r.left) / r.width * W; };
cv.addEventListener('pointerdown', e => { aim(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', aim);
cv.addEventListener('pointerup', e => { aim(e); drop(); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') aimX = clampX(aimX, cur ?? 0) - 15;
  if (e.key === 'ArrowRight') aimX = clampX(aimX, cur ?? 0) + 15;
  if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); drop(); }
});
$('play').onclick = $('again').onclick = start;
$('mute').textContent = muted ? '🔇' : '🔊';
$('mute').onclick = () => { muted = !muted; localStorage.setItem('evo-muted', muted ? '1' : '0'); $('mute').textContent = muted ? '🔇' : '🔊'; };
$('share').onclick = async () => {
  const text = `Hice ${score} puntos en Evolución Cósmica y llegué a ${TIERS[maxTier].name} 🪐`, url = location.href.split('?')[0];
  try { await navigator.share({ title: 'Evolución Cósmica', text, url }); }
  catch (e) { if (e.name !== 'AbortError') open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank'); }
};
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');

buildBg();
buildSprites().then(() => requestAnimationFrame(frame));
</script>
